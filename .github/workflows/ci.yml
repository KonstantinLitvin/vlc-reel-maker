name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests & Build Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LuaJIT & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit ffmpeg

      - name: Run test suite
        run: |
          luajit tests/test_reel_maker.lua

      - name: Verify build bundles
        run: |
          ./scripts/build.sh all
